version: '3.0'

services:
  api:
    container_name: api-django
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./media/:/media
    entrypoint: ./backend/wsgi-entrypoint.sh
    command: python manage.py runserver 0.0.0.0:8000
    restart: always
    depends_on:
      - db

  db:
    container_name: db-postgres
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=test_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    restart: always
    env_file: .env

  # web:
  #   container_name: web-react
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   restart: always
  #   command: npm start
  #   depends_on:
  #     - api

volumes:
  media:
  postgres_data:
