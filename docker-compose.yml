version: '3'

networks:
  dev:

services:
  db:
    container_name: db-postgres
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: always
    networks:
      dev:

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always

  api:
    container_name: api-django
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - media:/code/media
      - static:/code/static
    entrypoint: /code/wsgi-entrypoint.sh
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    profiles:
      - all
      - dev
    networks:
      dev:

