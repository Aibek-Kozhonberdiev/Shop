
services:
  api:
    container_name: api-django
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./media/:/media
    entrypoint: /code/wsgi-entrypoint.sh
    restart: always
    depends_on:
      - db
    env_file:
      - .env

  db:
    container_name: db-postgres
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: always

  # web:
  #   container_name: web-react
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   restart: always
  #   command: npm start
  #   depends_on:
  #     - api

volumes:
  media:
  postgres_data:
